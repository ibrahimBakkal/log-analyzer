server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The interface is one page that draws its own addresses (/inceleme,
    # /kurallar): whatever is not a file is that page.
    location / {
        try_files $uri /index.html;
    }

    # The page itself is always asked for again; the files it names carry a
    # hash of their content in their name and never change.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The API, under the same address as the pages, so the browser needs no
    # permission to call it. "api" is the name of its service in docker-compose.yml.
    location /api/ {
        # Looked up when a request comes in, not once at start: the API's
        # container may be replaced, and may not be there yet when nginx starts.
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;

        # /stream stays open and has to arrive as it is written.
        proxy_buffering off;
        proxy_read_timeout 1h;

        # Log files can be large: no size limit, and passed on while they arrive.
        client_max_body_size 0;
        proxy_request_buffering off;
    }
}
