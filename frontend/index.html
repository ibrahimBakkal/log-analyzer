<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>log-analyzer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2318222d'/%3E%3Crect x='3' y='4' width='10' height='2' fill='%23fbfcfd'/%3E%3Crect x='3' y='7' width='10' height='2' fill='%23fab219'/%3E%3Crect x='3' y='10' width='6' height='2' fill='%23fbfcfd'/%3E%3C/svg%3E"
    />
    <script>
      // Apply a theme the visitor chose earlier before the first paint, so the page
      // does not flash. Without a choice the system setting decides (see index.css).
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
