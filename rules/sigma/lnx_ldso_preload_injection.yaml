id: SIGMA-7e3c4651
name: Code Injection by ld.so Preload
description: Detects the ld.so preload persistence file. See `man ld.so` for more information.
type: keyword
severity: high
keywords:
  - /etc/ld.so.preload
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.execution
  - attack.stealth
  - attack.t1574.006
false_positives:
  - Rare temporary workaround for library misconfiguration
author: Christian Burkard (Nextron Systems)
source: https://github.com/SigmaHQ/sigma/blob/8a4813404ea3074890e0cda9272d4d1a8b2941d6/rules/linux/builtin/lnx_ldso_preload_injection.yml
