# SigmaHQ deposundaki bir kuraldan çevrildi: python -m app.sigma
# Özgün kural: rules/linux/builtin/lnx_clear_syslog.yml
# Elle yapılan değişiklikler, kural yeniden çevrilirse kaybolur.
id: SIGMA-e09eb557
name: Commands to Clear or Remove the Syslog - Builtin
description: Detects specific commands commonly used to remove or empty the syslog
type: keyword
severity: high
keywords:
  - rm /var/log/syslog
  - rm -r /var/log/syslog
  - rm -f /var/log/syslog
  - rm -rf /var/log/syslog
  - mv /var/log/syslog
  - ' >/var/log/syslog'
  - ' > /var/log/syslog'
exclude:
  - /syslog.
tags:
  - attack.impact
  - attack.t1565.001
false_positives:
  - Log rotation
author: Max Altgelt (Nextron Systems)
source: https://github.com/SigmaHQ/sigma/blob/8a4813404ea3074890e0cda9272d4d1a8b2941d6/rules/linux/builtin/lnx_clear_syslog.yml
