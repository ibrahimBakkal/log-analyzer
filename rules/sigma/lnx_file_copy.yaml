id: SIGMA-7a14080d
name: Remote File Copy
description: Detects the use of tools that copy files from or to remote systems
type: keyword
severity: low
keywords:
  - 'scp '
  - 'rsync '
  - 'sftp '
require:
  - - '@'
    - ':'
tags:
  - attack.command-and-control
  - attack.lateral-movement
  - attack.t1105
false_positives:
  - Legitimate administration activities
author: Ömer Günal
source: https://github.com/SigmaHQ/sigma/blob/8a4813404ea3074890e0cda9272d4d1a8b2941d6/rules/linux/builtin/lnx_file_copy.yml
