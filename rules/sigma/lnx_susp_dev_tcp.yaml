id: SIGMA-6cc5fceb
name: Suspicious Use of /dev/tcp
description: Detects suspicious command with /dev/tcp
type: keyword
severity: medium
keywords:
  - cat </dev/tcp/
  - exec 3<>/dev/tcp/
  - echo >/dev/tcp/
  - bash -i >& /dev/tcp/
  - sh -i >& /dev/udp/
  - 0<&196;exec 196<>/dev/tcp/
  - exec 5<>/dev/tcp/
  - (sh)0>/dev/tcp/
  - bash -c 'bash -i >& /dev/tcp/
  - echo -e '#!/bin/bash\nbash -i >& /dev/tcp/
tags:
  - attack.reconnaissance
author: frack113
source: https://github.com/SigmaHQ/sigma/blob/8a4813404ea3074890e0cda9272d4d1a8b2941d6/rules/linux/builtin/lnx_susp_dev_tcp.yml
