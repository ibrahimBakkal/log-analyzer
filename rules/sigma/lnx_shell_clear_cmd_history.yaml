id: SIGMA-fdc88d25
name: Linux Command History Tampering
description: Detects commands that try to clear or tamper with the Linux command history. This technique is used by threat actors in order to evade defenses and execute commands without them being recorded in files such as "bash_history" or "zsh_history".
type: keyword
severity: high
keywords:
  - cat /dev/null >*sh_history
  - cat /dev/zero >*sh_history
  - chattr +i*sh_history
  - echo "" >*sh_history
  - empty_bash_history
  - export HISTFILESIZE=0
  - history -c
  - history -w
  - ln -sf /dev/null *sh_history
  - ln -sf /dev/zero *sh_history
  - rm *sh_history
  - shopt -ou history
  - shopt -uo history
  - shred *sh_history
  - truncate -s0 *sh_history
tags:
  - attack.stealth
  - attack.t1070.003
author: Patrick Bareiss
source: https://github.com/SigmaHQ/sigma/blob/8a4813404ea3074890e0cda9272d4d1a8b2941d6/rules/linux/builtin/lnx_shell_clear_cmd_history.yml
