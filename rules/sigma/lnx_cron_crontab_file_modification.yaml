id: SIGMA-af202fd3
name: Modifying Crontab
description: Detects suspicious modification of crontab file.
type: keyword
severity: medium
match:
  service:
    - cron
    - CRON
    - crond
    - crontab
keywords:
  - REPLACE
tags:
  - attack.privilege-escalation
  - attack.execution
  - attack.persistence
  - attack.t1053.003
false_positives:
  - Legitimate modification of crontab
author: Pawel Mazur
source: https://github.com/SigmaHQ/sigma/blob/8a4813404ea3074890e0cda9272d4d1a8b2941d6/rules/linux/builtin/cron/lnx_cron_crontab_file_modification.yml
