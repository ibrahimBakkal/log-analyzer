[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "log-analyzer"
version = "0.1.0"
description = "SSH/auth loglarını ayrıştırıp zaman çizelgesi ve kural tabanlı uyarı üreten API"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "İbrahim Bakkal" }]
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.142",
    "pydantic>=2.7",
    "python-multipart>=0.0.9", # POST /ingest dosya yüklemesi için
    "sqlalchemy>=2.0",
    "tzdata; sys_platform == 'win32'", # Windows'ta saat dilimi veritabanı yok
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0", # FastAPI TestClient bunu kullanır
    "pytest>=8.0",
    # Yeni bir ruff serisi biçim kurallarını değiştirip CI'ı kendiliğinden kırmasın
    "ruff>=0.16,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# samples/generate.py testlerde `import generate` ile kullanılabilsin
pythonpath = ["../samples"]
