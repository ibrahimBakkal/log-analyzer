[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "log-analyzer"
version = "0.1.0"
description = "SSH/auth loglarını ayrıştırıp zaman çizelgesi ve kural tabanlı uyarı üreten API"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "İbrahim Bakkal" }]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27", # FastAPI TestClient bunu kullanır
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# samples/generate.py testlerde `import generate` ile kullanılabilsin
pythonpath = ["../samples"]
