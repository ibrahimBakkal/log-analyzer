name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: "Backend: lint ve testler"
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Bağımlılıkları kur
        run: pip install -e "backend[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Biçim (ruff format)
        run: ruff format --check .

      - name: Testler ve kapsam (pytest)
        run: pytest backend --cov=app --cov-report=term-missing:skip-covered --cov-report=json:coverage.json

      - name: Kapsam yüzdesi
        id: coverage
        run: python3 -c "import json; print('percent=' + json.load(open('coverage.json'))['totals']['percent_covered_display'])" >> "$GITHUB_OUTPUT"

  frontend:
    name: "Frontend: tip denetimi, testler, derleme"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Tip denetimi (tsc)
        run: npm run typecheck

      - name: Testler (vitest)
        run: npm test

      - name: Derleme (vite build)
        run: npm run build

      - name: Demo derlemesi (tek dosya)
        run: npm run build:demo

  docker:
    name: "Docker: derle, başlat, dene"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Derle ve başlat (docker compose up)
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Örnek verilerle dene
        run: python3 scripts/smoke.py http://localhost:8080

      - name: Yeniden başlat; veri yerinde, kopya yok
        run: |
          docker compose restart
          docker compose up --detach --wait --wait-timeout 120
          python3 scripts/smoke.py http://localhost:8080

      - name: Konteyner logları
        if: always()
        run: docker compose logs --no-color

      - name: Kapat
        if: always()
        run: docker compose down --volumes

  # README'deki kapsam rozeti bu dosyayı okur (shields.io "endpoint" rozeti).
  # Dosya, kodla karışmasın diye ayrı bir dalda durur: badges.
  badge:
    name: "Kapsam rozetini güncelle"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: badges dalına yaz
        env:
          PERCENT: ${{ needs.backend.outputs.coverage }}
        run: |
          case "$PERCENT" in ''|*[!0-9]*) echo "kapsam yüzdesi okunamadı: '$PERCENT'"; exit 1 ;; esac
          if [ "$PERCENT" -ge 90 ]; then color=brightgreen; elif [ "$PERCENT" -ge 75 ]; then color=yellow; else color=orange; fi
          badge="{\"schemaVersion\": 1, \"label\": \"test kapsamı (backend)\", \"message\": \"${PERCENT}%\", \"color\": \"${color}\"}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin badges; then
            git switch --quiet --detach FETCH_HEAD
            git switch --quiet -c badges
          else
            git switch --quiet --orphan badges
          fi
          echo "$badge" > coverage.json
          git add coverage.json
          if git diff --cached --quiet; then
            echo "Kapsam değişmedi: ${PERCENT}%"
          else
            git commit --quiet -m "Kapsam: ${PERCENT}%"
            git push origin badges
          fi
