name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: "Backend: lint ve testler"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Bağımlılıkları kur
        run: pip install -e "backend[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Biçim (ruff format)
        run: ruff format --check .

      - name: Testler (pytest)
        run: pytest backend

  frontend:
    name: "Frontend: tip denetimi, testler, derleme"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Tip denetimi (tsc)
        run: npm run typecheck

      - name: Testler (vitest)
        run: npm test

      - name: Derleme (vite build)
        run: npm run build

      - name: Demo derlemesi (tek dosya)
        run: npm run build:demo

  docker:
    name: "Docker: derle, başlat, dene"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Derle ve başlat (docker compose up)
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Örnek verilerle dene
        run: python3 scripts/smoke.py http://localhost:8080

      - name: Yeniden başlat; veri yerinde, kopya yok
        run: |
          docker compose restart
          docker compose up --detach --wait --wait-timeout 120
          python3 scripts/smoke.py http://localhost:8080

      - name: Konteyner logları
        if: always()
        run: docker compose logs --no-color

      - name: Kapat
        if: always()
        run: docker compose down --volumes
